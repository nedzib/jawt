name = "notify"
description = "Muestra una notificación de macOS (estática o por item de fan-out)"
exec = "main.rb"

[inputs]
title = { type = "string", required = false }
message = { type = "string", required = false }
item = { type = "object", required = false }

[outputs]
items = "array<object>"

[ports]
out = ["items"]

[behavior]
cardinality = "single"
on_failure = "stop"
