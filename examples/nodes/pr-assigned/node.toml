name = "pr-assigned"
description = "Lista los PR asignados al usuario autenticado"
exec = "main.rb"

[inputs]
assignee = { type = "string", required = false }
repo = { type = "string", required = false }

[outputs]
count = "integer"
items = "array<object>"

[ports]
out = ["count", "items"]

[behavior]
cardinality = "single"
on_failure = "stop"
