name = "pr-review"
description = "PRs donde soy revisor directo (excluye asignación por equipo)"
exec = "main.rb"

[inputs]
repo = { type = "string", required = false }

[outputs]
count = "integer"
items = "array<object>"

[ports]
out = ["count", "items"]

[behavior]
cardinality = "single"
on_failure = "stop"
